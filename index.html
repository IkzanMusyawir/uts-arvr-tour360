<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>UTS AR/VR &mdash; Tur 360&deg; 15 Titik</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111;
      font-family: Arial, Helvetica, sans-serif; }

    /* ---------- Label titik (kanan atas) ---------- */
    #info {
      position: absolute; top: 14px; right: 14px; z-index: 20;
      padding: 8px 14px; border-radius: 10px;
      background: rgba(18,18,28,0.72); color: #eee; font-size: 12px; line-height: 1.5;
    }
    #info b { color: #7ec8ff; }

    /* ---------- Mini map (KIRI ATAS) ---------- */
    #minimap {
      position: absolute; top: 14px; left: 14px; z-index: 20; width: 210px;
      padding: 8px; border-radius: 10px;
      background: rgba(18,18,28,0.72); color: #eee; user-select: none;
    }
    #minimap .judul { font-size: 12px; margin-bottom: 6px; color: #7ec8ff; }
    #minimap svg { display: block; width: 100%; height: auto; }
    #minimap circle { cursor: pointer; }
    #minimap .node      { fill: #4a5a72; stroke: #cde3ff; stroke-width: 1; }
    #minimap .node.aktif{ fill: #ffb400; stroke: #fff; }
    #minimap text       { fill: #dfe9ff; font-size: 6px; text-anchor: middle;
                          pointer-events: none; }

    /* ---------- Bar navigasi bawah ---------- */
    #nav {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      z-index: 20; display: flex; gap: 14px; align-items: center;
      padding: 8px 16px; border-radius: 30px; background: rgba(18,18,28,0.75); color: #eee;
    }
    #nav button {
      cursor: pointer; border: 0; border-radius: 20px; padding: 8px 16px;
      background: #2a6fb0; color: #fff; font-size: 13px;
    }
    #nav button:hover { background: #3a86cf; }
    #nav button.ujung { opacity: .45; }
    #nav #label { font-size: 13px; min-width: 90px; text-align: center; }

    /* ---------- Loading ---------- */
    #loading {
      position: absolute; inset: 0; z-index: 30; display: flex;
      align-items: center; justify-content: center; color: #cde3ff;
      background: #111; font-size: 15px;
    }

    /* ---------- Transisi halus (crossfade ala Google Maps) ---------- */
    #nav #label { transition: opacity .2s ease; }
    #nav #label.pindah { opacity: .35; }

    /* ---------- Notifikasi batas tur ---------- */
    #notif {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.9);
      z-index: 40; max-width: 340px; padding: 18px 26px; border-radius: 14px;
      background: rgba(20, 26, 40, 0.92); color: #fff; text-align: center;
      font-size: 15px; line-height: 1.5; border: 1px solid rgba(126,200,255,.35);
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
      opacity: 0; pointer-events: none; transition: opacity .3s ease, transform .3s ease;
    }
    #notif.tampil { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    #notif b { color: #ffb400; display: block; font-size: 17px; margin-bottom: 6px; }

    /* Sembunyikan UI/modal VR bawaan A-Frame (tidak dipakai) */
    .a-enter-vr, .a-enter-ar, .a-modal, .a-dialog { display: none !important; }
  </style>
</head>

<body>

  <!-- ============ MINI MAP (kiri atas) ============ -->
  <div id="minimap">
    <div class="judul">Mini Map &mdash; Denah Titik</div>
    <svg id="mapSvg" viewBox="0 0 200 140" aria-label="Mini map titik tur"></svg>
  </div>

  <!-- ============ Petunjuk (kanan atas) ============ -->
  <div id="info">
    <b>Tur 360&deg;</b> &mdash; UTS AR/VR<br>
    <b>Seret / swiping</b> : lihat sekeliling<br>
    <span style="font-size:11px;color:#9fb2cc;">
      Gerakkan perangkat / seret : putar pandangan
    </span>
  </div>

  <!-- ============ Navigasi bawah ============ -->
  <div id="nav">
    <button id="prev">&larr; Sebelumnya</button>
    <div id="label">Titik 1 / 15</div>
    <button id="next">Berikutnya &rarr;</button>
  </div>

  <div id="loading">Memuat panorama&hellip;</div>

  <!-- Notifikasi batas tur (akhir / awal) -->
  <div id="notif"></div>

  <!-- ============ PANGGUNG A-FRAME ============ -->
  <a-scene renderer="antialias: true; colorManagement: true"
           vr-mode-ui="enabled: false"
           loading-screen="enabled: false">

    <a-assets id="assets"></a-assets>

    <!-- Dua lapis sky untuk crossfade antar panorama.
         Hanya satu yang terlihat penuh pada satu waktu. -->
    <a-sky id="skyA" src="#pano0" material="shader: flat" radius="500"></a-sky>
    <a-sky id="skyB" material="shader: flat" radius="500"></a-sky>

    <!-- Wadah objek 3D (diisi otomatis dari daftar OBJEK3D di bawah) -->
    <a-entity id="wadah3d"></a-entity>

    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls="pointerLockEnabled: false; magicWindowTrackingEnabled: true"
                wasd-controls="acceleration: 20">
      </a-camera>
    </a-entity>

    <!-- Lampu (dipakai hanya kalau model GLB butuh pencahayaan) -->
    <a-entity light="type: ambient; intensity: 0.9"></a-entity>
    <a-entity light="type: directional; intensity: 0.6" position="1 2 1"></a-entity>

  </a-scene>

  <script>
  /* =====================================================================
     1) DAFTAR TITIK 360
        - foto   : path gambar (relatif ke index.html)
        - pos    : koordinat [x, y] untuk digambar di mini map (satuan bebas)
        - label  : nama titik
     ===================================================================== */
  const TITIK = [
    { foto: "foto/1.jpg",  label: "Titik 1",  pos: [ 20, 120] },
    { foto: "foto/2.jpg",  label: "Titik 2",  pos: [ 55, 118] },
    { foto: "foto/3.jpg",  label: "Titik 3",  pos: [ 90, 122] },
    { foto: "foto/4.jpg",  label: "Titik 4",  pos: [125, 118] },
    { foto: "foto/5.jpg",  label: "Titik 5",  pos: [165, 120] },
    { foto: "foto/6.jpg",  label: "Titik 6",  pos: [160,  85] },
    { foto: "foto/7.jpg",  label: "Titik 7",  pos: [130,  80] },
    { foto: "foto/8.jpg",  label: "Titik 8",  pos: [ 95,  84] },
    { foto: "foto/9.jpg",  label: "Titik 9",  pos: [ 60,  80] },
    { foto: "foto/10.jpg", label: "Titik 10", pos: [ 25,  82] },
    { foto: "foto/11.jpg", label: "Titik 11", pos: [ 25,  45] },
    { foto: "foto/12.jpg", label: "Titik 12", pos: [ 65,  42] },
    { foto: "foto/13.jpg", label: "Titik 13", pos: [100,  46] },
    { foto: "foto/14.jpg", label: "Titik 14", pos: [140,  42] },
    { foto: "foto/15.jpg", label: "Titik 15", pos: [175,  45] }
  ];

  /* =====================================================================
     2) OBJEK 3D  (5 SLOT -- TINGGAL DIISI SAAT MODEL SUDAH SIAP)
        - model : path file .glb  (contoh: "assets/model1.glb")
        - titik : index titik tempat objek TAMPIL (0 = Titik 1 ... 14 = Titik 15)
        - pos   : posisi di dalam ruangan [x, y, z]
        - rot   : rotasi [x, y, z]
        - scale : perbesaran

        Cara pakai nanti:
          a. taruh file .glb ke folder  assets/
          b. isi nilai "model" di bawah (ganti null -> "assets/namafile.glb")
          c. selesai. Objek hanya muncul di titik yang ditentukan.
        Saat "model" masih null, tidak ada apa-apa yang ditampilkan.
     ===================================================================== */
  const OBJEK3D = [
    { model: null, titik:  2, pos: [0, 1.0, -2.5], rot: [0, 0, 0],   scale: 1 }, // muncul di Titik 3
    { model: null, titik:  5, pos: [1.5, 1.0, -2.0], rot: [0, -30, 0], scale: 1 }, // muncul di Titik 6
    { model: null, titik:  8, pos: [-1.5, 1.0, -2.5], rot: [0, 30, 0], scale: 1 }, // muncul di Titik 9
    { model: null, titik: 11, pos: [0, 1.0, -2.5], rot: [0, 0, 0],   scale: 1 }, // muncul di Titik 12
    { model: null, titik: 14, pos: [0, 1.0, -3.0], rot: [0, 0, 0],   scale: 1 }  // muncul di Titik 15
  ];

  /* ===================================================================== */
  const skyA    = document.querySelector('#skyA');
  const skyB    = document.querySelector('#skyB');
  const rig     = document.querySelector('#rig');
  const camera  = document.querySelector('#camera');
  const assets  = document.querySelector('#assets');
  const wadah3d = document.querySelector('#wadah3d');
  const label   = document.querySelector('#label');
  const loading = document.querySelector('#loading');
  let aktif = 0;
  let skyDepan = skyA, skyBelakang = skyB;   // skyDepan = yang sedang tampil

  // ---- Siapkan <img> di <a-assets> untuk tiap titik ----
  // VERSI_FOTO: naikkan angka ini tiap kali foto diganti, supaya browser
  // tidak memakai versi lama dari cache (mis. ubah jadi 2, 3, dst).
  const VERSI_FOTO = 2;
  TITIK.forEach((t, i) => {
    const img = document.createElement('img');
    img.id = 'pano' + i;
    img.src = t.foto + '?v=' + VERSI_FOTO;
    assets.appendChild(img);
  });

  // ---- Siapkan <a-asset-item> untuk tiap model 3D yang sudah diisi ----
  OBJEK3D.forEach((o, i) => {
    if (!o.model) return;
    const it = document.createElement('a-asset-item');
    it.id = 'glb' + i;
    it.setAttribute('src', o.model);
    assets.appendChild(it);
  });

  // ---- Bangun objek 3D ----
  function bangunObjek3D() {
    OBJEK3D.forEach((o, i) => {
      if (!o.model) return;                         // slot masih kosong -> lewati
      const e = document.createElement('a-entity');
      e.setAttribute('id', 'obj' + i);
      e.setAttribute('gltf-model', '#glb' + i);
      e.setAttribute('position', o.pos.join(' '));
      e.setAttribute('rotation', o.rot.join(' '));
      e.setAttribute('scale', o.scale + ' ' + o.scale + ' ' + o.scale);
      wadah3d.appendChild(e);
    });
    // tampilkan objek sesuai titik aktif
    tampilkanObjekUntuk(0);
  }

  function tampilkanObjekUntuk(titikIndexAktif) {
    OBJEK3D.forEach((o, i) => {
      const e = document.getElementById('obj' + i);
      if (!e) return;
      if (o.titik === titikIndexAktif) e.setAttribute('visible', true);
      else e.setAttribute('visible', false);
    });
  }

  // ---- Notifikasi batas tur ----
  const notifEl = document.querySelector('#notif');
  let notifTimer = null;
  function notif(html, ms = 2600) {
    notifEl.innerHTML = html;
    notifEl.classList.add('tampil');
    clearTimeout(notifTimer);
    notifTimer = setTimeout(() => notifEl.classList.remove('tampil'), ms);
  }

  // ---- Ganti titik dengan transisi halus (crossfade) ----
  let sedangPindah = false;

  function keTitik(i) {
    if (sedangPindah) return;                 // hindari tumpang tindih transisi
    if (i > TITIK.length - 1) {               // sudah di titik terakhir -> jangan putar balik
      notif('<b>Akhir Tur</b>Ini titik terakhir (Titik 15).<br>Tekan <b>Sebelumnya</b> untuk kembali, atau klik titik di mini map.');
      return;
    }
    if (i < 0) {                              // sudah di titik pertama
      notif('<b>Awal Tur</b>Ini titik pertama (Titik 1).<br>Tekan <b>Berikutnya</b> untuk mulai menjelajah.');
      return;
    }

    const baru = i;
    if (baru === aktif) { gambarMap(); return; }
    sedangPindah = true;

    const img = document.getElementById('pano' + baru);

    // FLY-THROUGH ala Google Maps:
    // zoom-in cepat & dalam (FOV 80 -> 20) + crossfade di puncak zoom,
    // ditambah dolly maju -> terasa benar-benar "melesat" ke lokasi berikutnya.
    const DUR      = 520;                     // durasi (ms) - singkat & gesit
    const FOV_AWAL = camera.getAttribute('fov') || 80;
    const FOV_PUNCAK = 20;                    // makin kecil = zoom makin dalam

    // easing: melesat cepat lalu mengendap halus (easeOutQuart)
    const ease = t => 1 - Math.pow(1 - t, 4);

    const mulaiTransisi = () => {
      // panorama tujuan disiapkan di lapis belakang
      skyBelakang.setAttribute('src', '#pano' + baru);

      label.classList.add('pindah');
      label.textContent = TITIK[baru].label + ' / ' + TITIK.length;

      let t0 = null;
      function langkah(ts) {
        if (t0 === null) t0 = ts;
        const p = Math.min((ts - t0) / DUR, 1);        // 0..1
        const e = ease(p);

        // --- ZOOM-IN tajam: lensa mengecil drastis = pandangan melesat maju ---
        camera.setAttribute('fov', FOV_AWAL - (FOV_AWAL - FOV_PUNCAK) * e);

        // --- DOLLY maju: kamera bergerak mendekat sehingga efek "terbang" kuat ---
        rig.setAttribute('position', { x: 0, y: 1.6, z: -1.6 * e });

        // crossfade: panorama tujuan muncul saat zoom mendekati puncak
        const fade = Math.min(Math.max((p - 0.3) / 0.4, 0), 1);
        skyBelakang.setAttribute('opacity', fade);
        skyDepan.setAttribute('opacity',   1 - fade);

        if (p < 1) { requestAnimationFrame(langkah); return; }

        // --- selesai: mendarat, kembalikan FOV & posisi, tukar peran depan/belakang ---
        label.classList.remove('pindah');

        const tmp = skyDepan; skyDepan = skyBelakang; skyBelakang = tmp;
        skyDepan.setAttribute('opacity', 1);
        skyBelakang.setAttribute('opacity', 0);
        skyBelakang.setAttribute('src', '');   // lepas tekstur lama (hemat memori)

        camera.setAttribute('fov', FOV_AWAL);  // reset lensa (instan, tidak terlihat)
        rig.setAttribute('position', '0 1.6 0');
        aktif = baru;
        tampilkanObjekUntuk(aktif);
        gambarMap();
        perbaruiTombol();
        sedangPindah = false;
      }
      requestAnimationFrame(langkah);
    };

    if (img.complete) mulaiTransisi();
    else {
      loading.style.display = 'flex';
      img.addEventListener('load', () => {
        loading.style.display = 'none';
        mulaiTransisi();
      }, { once: true });
    }
  }

  // ---- Mini map ----
  const svg = document.querySelector('#mapSvg');
  function gambarMap() {
    svg.innerHTML = '';
    // garis penghubung antar titik (urutan rute)
    const jalur = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
    jalur.setAttribute('points', TITIK.map(t => t.pos.join(',')).join(' '));
    jalur.setAttribute('fill', 'none');
    jalur.setAttribute('stroke', '#4a5a72');
    jalur.setAttribute('stroke-width', '1');
    svg.appendChild(jalur);

    TITIK.forEach((t, i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', t.pos[0]);
      c.setAttribute('cy', t.pos[1]);
      c.setAttribute('r', i === aktif ? 5.5 : 4);
      c.setAttribute('class', 'node' + (i === aktif ? ' aktif' : ''));
      c.addEventListener('click', () => keTitik(i));
      svg.appendChild(c);

      const tx = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      tx.setAttribute('x', t.pos[0]);
      tx.setAttribute('y', t.pos[1] - 7);
      tx.textContent = i + 1;
      svg.appendChild(tx);
    });
  }

  // ---- Tombol navigasi ----
  const btnPrev = document.querySelector('#prev');
  const btnNext = document.querySelector('#next');

  // saat di ujung tur, tombol tetap bisa diklik tapi tampak redup
  // (klik -> muncul notifikasi batas, bukan pindah titik)
  function perbaruiTombol() {
    btnPrev.classList.toggle('ujung', aktif === 0);
    btnNext.classList.toggle('ujung', aktif === TITIK.length - 1);
  }

  btnPrev.addEventListener('click', () => keTitik(aktif - 1));
  btnNext.addEventListener('click', () => keTitik(aktif + 1));

  // keyboard: panah kiri/kanan tetap untuk desktop
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') keTitik(aktif + 1);
    if (e.key === 'ArrowLeft')  keTitik(aktif - 1);
  });

  // ---- Mulai ----
  const pertama = document.getElementById('pano0');
  const mulai = () => {
    bangunObjek3D();
    // kondisi awal: panorama pertama langsung tampil tanpa fade
    skyDepan.setAttribute('src', '#pano0');
    skyDepan.setAttribute('opacity', 1);
    skyBelakang.setAttribute('opacity', 0);
    label.textContent = TITIK[0].label + ' / ' + TITIK.length;
    tampilkanObjekUntuk(0);
    gambarMap();
    perbaruiTombol();
    loading.style.display = 'none';
  };
  if (pertama.complete) mulai();
  else pertama.addEventListener('load', mulai, { once: true });

  /* ---- Self-check sederhana ---- */
  console.assert(TITIK.length === 15, 'TITIK harus 15');
  console.assert(OBJEK3D.length === 5, 'OBJEK3D harus 5 slot');
  console.assert(
    OBJEK3D.every(o => o.titik >= 0 && o.titik < TITIK.length),
    'titik objek 3D harus dalam rentang'
  );
  </script>

</body>
</html>
